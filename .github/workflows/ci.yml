name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Fast checks (parallel) ──────────────────────────────
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build
      - run: cmake --build build
      - run: bash tests/run_tests.sh
      - run: python3 tests/analyzer/run_analyzer_tests.py

  lint-lsp:
    name: Typecheck LSP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: cd mac-lang && npm ci
      - run: cd mac-lang && npx tsc --noEmit

  # ── Notify mac-studio to test + deploy ──────────────────
  notify-studio:
    name: Trigger mac-studio CI
    needs: [test-linux, lint-lsp]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to mac-studio
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.STUDIO_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/mac-studio-meme/mac-studio/dispatches \
            -d '{"event_type": "mac-cpp-updated"}'

  # ── Release builds (only on tags) ───────────────────────
  check-version:
    name: Validate version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match VERSION file
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          FILE=$(cat VERSION | tr -d '[:space:]')
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::Tag v$TAG does not match VERSION file ($FILE)"
            exit 1
          fi
          echo "Version $FILE confirmed"

  test-macos:
    name: Test (macOS)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build
      - run: cmake --build build
      - run: bash tests/run_tests.sh
      - run: python3 tests/analyzer/run_analyzer_tests.py

  test-windows:
    name: Test (Windows)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build
      - run: cmake --build build --config Release
      - run: python3 tests/analyzer/run_analyzer_tests.py

  release:
    name: Build (${{ matrix.target }})
    needs: [test-linux, test-macos, test-windows, lint-lsp, check-version]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-latest,  target: mac-macos-arm64 }
          - { os: macos-15,      target: mac-macos-x86_64 }
          - { os: ubuntu-latest, target: mac-linux-x86_64 }
          - { os: windows-latest, target: mac-windows-x86_64 }
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: bash tests/run_tests.sh
      - run: python3 tests/analyzer/run_analyzer_tests.py
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.target }}
          cp build/mac dist/${{ matrix.target }}/mac
          cp -r build/assets dist/${{ matrix.target }}/assets
          cp -r build/stdlib dist/${{ matrix.target }}/stdlib
          cp README.md dist/${{ matrix.target }}/
          cd dist && tar czf ${{ matrix.target }}.tar.gz ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.target }}
          Copy-Item build/Release/mac.exe dist/${{ matrix.target }}/mac.exe
          Copy-Item -Recurse build/assets dist/${{ matrix.target }}/assets
          Copy-Item -Recurse build/stdlib dist/${{ matrix.target }}/stdlib
          Copy-Item README.md dist/${{ matrix.target }}/
          Compress-Archive -Path dist/${{ matrix.target }} -DestinationPath dist/${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}.tar.gz
            dist/${{ matrix.target }}.zip

  publish:
    name: Publish Release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
