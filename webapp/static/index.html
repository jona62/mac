<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mac GIF Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="studio">
    <header class="masthead">
      <div class="masthead__brand">
        <h1 class="masthead__title">GIF<br/><span>Studio</span></h1>
        <p class="masthead__sub">Meme as Code</p>
      </div>
      <div class="masthead__stats">
        <div class="stat"><span class="stat__val" id="statCanvas">640&times;640</span><span class="stat__label">Canvas</span></div>
        <div class="stat"><span class="stat__val" id="statFrames">3</span><span class="stat__label">Frames</span></div>
        <div class="stat"><span class="stat__val" id="statDuration">1.2s</span><span class="stat__label">Runtime</span></div>
      </div>
    </header>

    <main class="workspace">
      <!-- Left: Controls -->
      <section class="controls">
        <!-- Templates -->
        <div class="panel">
          <h2 class="panel__title">Templates</h2>
          <div class="tmpl-tabs" id="tmplTabs">
            <button class="tmpl-tab is-active" data-cat="canvas">Canvas</button>
            <button class="tmpl-tab" data-cat="meme">Meme Images</button>
          </div>
          <div class="template-grid" id="templateGrid"></div>
        </div>

        <!-- Presets -->
        <div class="panel">
          <h2 class="panel__title">Quick Start</h2>
          <div class="presets" id="presetStrip"></div>
        </div>

        <!-- Canvas -->
        <div class="panel">
          <h2 class="panel__title">Canvas <span class="badge" id="sizeBadge">640&times;640</span></h2>
          <div class="range-row">
            <label>Width</label>
            <input type="range" id="widthRange" min="240" max="1200" step="10" value="640" />
            <input type="number" id="widthNum" min="240" max="1200" step="10" value="640" />
          </div>
          <div class="range-row">
            <label>Height</label>
            <input type="range" id="heightRange" min="240" max="1200" step="10" value="640" />
            <input type="number" id="heightNum" min="240" max="1200" step="10" value="640" />
          </div>
        </div>

        <!-- Effect -->
        <div class="panel">
          <h2 class="panel__title">Effect</h2>
          <select id="effectSelect" class="select"></select>
        </div>

        <!-- Style -->
        <div class="panel">
          <h2 class="panel__title">Text Style</h2>
          <div class="range-row">
            <label>Color</label>
            <input type="color" id="textColor" value="#ffffff" class="color-input" />
            <input type="text" id="textColorHex" value="#FFFFFF" class="hex-input" placeholder="#FFFFFF" />
          </div>
          <div class="range-row">
            <label>Outline</label>
            <input type="range" id="outlineRange" min="0" max="10" step="1" value="3" />
            <span class="range-val" id="outlineVal">3px</span>
          </div>
        </div>

        <!-- Frames -->
        <div class="panel panel--frames">
          <div class="panel__head">
            <h2 class="panel__title">Frames</h2>
            <button class="btn btn--accent" id="addFrameBtn">+ Frame</button>
          </div>
          <div id="frameList" class="frame-list"></div>
        </div>
      </section>

      <!-- Right: Output -->
      <section class="output">
        <div class="panel">
          <div class="panel__head">
            <h2 class="panel__title">Preview</h2>
            <button class="btn btn--dark" id="renderBtn">Render GIF</button>
          </div>
          <div class="preview-stage" id="previewStage">
            <p class="preview-placeholder" id="placeholder">Configure frames and hit Render</p>
            <img id="gifPreview" alt="Generated GIF" hidden />
          </div>
          <div class="preview-meta">
            <p class="status" id="statusLine">Ready</p>
            <a class="btn btn--outline" id="downloadLink" href="#" download="mac-meme.gif" hidden>Download</a>
          </div>
        </div>

        <div class="panel">
          <h2 class="panel__title">Mac Script <span class="badge">v2</span></h2>
          <pre class="code-preview" id="scriptPreview"></pre>
        </div>
      </section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
