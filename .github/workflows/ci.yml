name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Lane 1: Fast checks (parallel) ────────────────────
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build
      - run: cmake --build build
      - run: bash tests/run_tests.sh

  lint-lsp:
    name: Typecheck LSP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: cd mac-lang && npm ci
      - run: cd mac-lang && npx tsc --noEmit

  # ── Lane 2: Deploy (after Linux test passes) ──────────
  deploy:
    name: Deploy to Rigbox
    needs: test-linux
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: eu-west-1.rigbox.dev
          username: base-uvvrblcc-1yvx9yo7
          key: ${{ secrets.RIGBOX_SSH_KEY }}
          script: bash ~/deploy.sh

  # ── Lane 3: Release builds (only on tags, parallel) ───
  test-macos:
    name: Test (macOS)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build
      - run: cmake --build build
      - run: bash tests/run_tests.sh

  release:
    name: Build (${{ matrix.target }})
    needs: [test-linux, test-macos, lint-lsp]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-latest,  target: mac-macos-arm64 }
          - { os: macos-15,      target: mac-macos-x86_64 }
          - { os: ubuntu-latest, target: mac-linux-x86_64 }
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: bash tests/run_tests.sh
      - name: Package
        run: |
          mkdir -p dist/${{ matrix.target }}
          cp build/mac dist/${{ matrix.target }}/mac
          cp -r build/assets dist/${{ matrix.target }}/assets
          cp -r build/stdlib dist/${{ matrix.target }}/stdlib
          cp README.md dist/${{ matrix.target }}/
          cd dist && tar czf ${{ matrix.target }}.tar.gz ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}.tar.gz

  publish:
    name: Publish Release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
