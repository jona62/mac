name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Run unit tests
        run: bash tests/run_tests.sh

      - name: Verify test count
        run: |
          count=$(bash tests/run_tests.sh 2>&1 | grep "Results:" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+')
          echo "Tests passed: $count"
          if [ "$count" -lt 46 ]; then
            echo "ERROR: Expected at least 46 tests, got $count"
            exit 1
          fi

  lint-lsp:
    name: Typecheck LSP
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd mac-lang && npm ci

      - name: Typecheck
        run: cd mac-lang && npx tsc --noEmit

  release:
    name: Release (${{ matrix.target }})
    needs: [test, lint-lsp]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac-macos-arm64
          - os: macos-13
            target: mac-macos-x86_64
          - os: ubuntu-latest
            target: mac-linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests on release build
        run: bash tests/run_tests.sh

      - name: Package
        run: |
          mkdir -p dist/${{ matrix.target }}
          cp build/mac dist/${{ matrix.target }}/mac
          cp -r build/assets dist/${{ matrix.target }}/assets
          cp -r build/stdlib dist/${{ matrix.target }}/stdlib
          cp README.md dist/${{ matrix.target }}/
          cd dist && tar czf ${{ matrix.target }}.tar.gz ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}.tar.gz

  publish:
    name: Publish Release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
